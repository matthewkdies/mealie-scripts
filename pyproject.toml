[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mealie-macros"
version = "0.1.0"
description = "A capable Python CLI for interacting with your Mealie instance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx2>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
mealie-scripts = "mealie_scripts.main:app"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
]

[tool.uv]
managed = true
package = true

[tool.hatch.build.targets.wheel]
packages = ["mealie_scripts"]
