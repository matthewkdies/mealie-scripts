[project]
name = "mealie-macros"
version = "0.1.0"
description = "A capable Python CLI for interacting with your Mealie instance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx2>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
mealie-scripts = "mealie_scripts.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
package = true
